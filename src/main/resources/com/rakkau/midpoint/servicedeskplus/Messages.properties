serviceDesk.connector.display=ManageEngine ServiceDesk Plus Connector

serviceDesk.baseUrl=Base URL
serviceDesk.baseUrl.help=Base URL of ServiceDesk Plus including scheme and port, without the /api/v3 suffix (e.g. https://sdp.example.com:8080).
serviceDesk.authToken=API token
serviceDesk.authToken.help=Technician API key sent in the 'authtoken' header.
serviceDesk.pageSize=Page size
serviceDesk.pageSize.help=Rows requested per page when listing users (1-100, default 100).
serviceDesk.timeoutSeconds=Timeout (seconds)
serviceDesk.timeoutSeconds.help=Connect and read timeout for HTTP calls (1-300, default 30).
serviceDesk.trustAllCertificates=Trust all TLS certificates
serviceDesk.trustAllCertificates.help=Disables TLS certificate and host name validation for the connections of this resource only. Use in isolated test environments only; in production import the CA certificate into the JVM trust store. Default: false.
